name: collect

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 h at :23 UTC (top of the hour is GitHub's busiest slot)
  workflow_dispatch:          # "Run workflow" button, also from the GitHub mobile app

concurrency:
  group: collect              # never two runs writing at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: Run collector
        run: python -m collector.main
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HACKRADAR_CONTACT: ${{ secrets.HACKRADAR_CONTACT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Sources block GitHub's IPs; pages are fetched through Supabase (migration 0006_fetch_url)
          FETCH_VIA: supabase
          SOURCES: unstop,devfolio,hack2skill,hackerearth,ethglobal,hackster
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚨 HackRadar collector poora fail ho gaya (koi source save nahi hua). Logs: ${RUN_URL}" \
            -o /dev/null -w "telegram %{http_code}\n"
