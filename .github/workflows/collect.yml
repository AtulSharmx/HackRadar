name: collect

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 h at :23 UTC (top of the hour is GitHub's busiest slot)
  workflow_dispatch:          # "Run workflow" button, also from the GitHub mobile app

concurrency:
  group: collect              # never two runs writing at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: Run collector
        run: python -m collector.main
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HACKRADAR_CONTACT: ${{ secrets.HACKRADAR_CONTACT }}
